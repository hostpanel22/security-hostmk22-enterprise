name: Bug Report
description: Report a reproducible bug in HostMK Security Framework
title: "[BUG] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug.

        Please provide as much information as possible to help us reproduce and fix the issue.

  - type: input
    id: summary
    attributes:
      label: Bug Summary
      description: Short description of the issue
      placeholder: Authentication request returns 500 error
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Detailed Description
      description: Explain the problem in detail
      placeholder: Describe what happened and why it appears incorrect
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps To Reproduce
      description: Provide exact steps to reproduce the issue
      placeholder: |
        1. Create client
        2. Authenticate user
        3. Call endpoint
        4. Observe error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What should happen?
      placeholder: Request should return HTTP 200
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened?
      placeholder: Request returned HTTP 500
    validations:
      required: true

  - type: dropdown
    id: sdk
    attributes:
      label: Affected SDK
      options:
        - PHP SDK
        - Node.js SDK
        - Python SDK
        - Go SDK
        - API
        - Documentation
        - CI/CD
        - Other
    validations:
      required: true

  - type: input
    id: sdk_version
    attributes:
      label: SDK Version
      description: Version currently in use
      placeholder: 1.0.0

  - type: input
    id: framework_version
    attributes:
      label: HostMK Framework Version
      placeholder: latest

  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - Critical
        - High
        - Medium
        - Low
    validations:
      required: true

  - type: input
    id: operating_system
    attributes:
      label: Operating System
      placeholder: Windows 11 / Ubuntu 24.04 / macOS

  - type: input
    id: runtime
    attributes:
      label: Runtime Version
      placeholder: PHP 8.3 / Node 22 / Python 3.14

  - type: textarea
    id: logs
    attributes:
      label: Logs / Stack Trace
      description: Paste logs or exception details
      render: shell

  - type: textarea
    id: code_sample
    attributes:
      label: Minimal Reproduction
      description: Optional code sample reproducing the issue
      render: php

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues before opening this report
          required: true
        - label: I can reproduce this issue consistently
          required: true
        - label: I included all relevant logs and details
          required: true
        - label: This issue is not related to local environment misconfiguration
          required: true