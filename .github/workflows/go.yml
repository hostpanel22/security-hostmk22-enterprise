name: Go CI/CD

on:
  push:
    branches:
      - main
      - develop
      - release/*
    tags:
      - v*

  pull_request:
    branches:
      - main
      - develop

  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test & Build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ['1.26']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: true
          cache-dependency-path: go.sum

      - name: Install dependencies
        run: go mod download

      - name: Verify dependencies
        run: go mod verify

      - name: Tidy dependencies
        run: go mod tidy

      - name: Run Go vet
        run: go vet ./...

      - name: Run Go fmt check
        run: |
          FMT_OUTPUT=$(gofmt -l .)
          if [ -n "$FMT_OUTPUT" ]; then
            echo "Files need formatting:"
            echo "$FMT_OUTPUT"
            exit 1
          fi

      - name: Run tests
        run: go test -v -coverprofile=coverage.out -covermode=atomic ./...

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: go-coverage-${{ matrix.go-version }}
          path: coverage.out
          if-no-files-found: ignore

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Install dependencies
        run: go mod download

      - name: Run Go security check
        run: go vet ./...

      - name: Run Gosec security scanner
        uses: gosec-action@v1
        with:
          args: -include=G101,G102,G103,G104,G106,G107,G108,G201,G202,G203,G204,G301,G302,G304,G306,G307,G401,G402,G403,G404,G501,G502,G503,G504,G505,G601 ./...
        continue-on-error: true

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [test, security]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Install dependencies
        run: go mod download

      - name: Build for Linux amd64
        run: |
          mkdir -p dist
          GOOS=linux GOARCH=amd64 go build -o dist/hostmk-security-linux-amd64 ./cmd/server

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hostmk-security-binaries
          path: dist/*
          if-no-files-found: error
