name: Python SDK CI

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

jobs:

  test:

    name: Python ${{ matrix.python-version }}

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false

      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"

    defaults:
      run:
        working-directory: sdk/python

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip

      - name: Install package
        run: |
          pip install -e .

      - name: Install test dependencies
        run: |
          pip install pytest pytest-cov ruff

      - name: Lint
        run: |
          ruff check .

      - name: Run tests
        run: |
          pytest

      - name: Run tests with coverage
        run: |
          pytest --cov=hostmk_security --cov-report=xml --cov-report=term

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: python-coverage-${{ matrix.python-version }}
          path: sdk/python/coverage.xml
          if-no-files-found: ignore

  package:

    name: Package Validation

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: sdk/python

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip

      - name: Install build tools
        run: |
          pip install build twine

      - name: Build package
        run: |
          python -m build

      - name: Validate package
        run: |
          twine check dist/*

  security:

    name: Security Scan

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: sdk/python

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip

      - name: Install safety
        run: |
          pip install safety

      - name: Security audit
        run: |
          safety scan || true