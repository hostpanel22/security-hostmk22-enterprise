# HostMK Security Framework - Docker Compose Configuration
# Use: docker-compose up -d

version: '3.8'

services:
  # ============================================================================
  # Security Framework API Server
  # ============================================================================
  security-api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: ${APP_VERSION:-1.0.0}
        COMMIT: ${GIT_COMMIT:-$(git rev-parse --short HEAD)}
        DATE: ${BUILD_DATE:-$(date +%Y-%m-%dT%H:%M:%SZ)}
    container_name: hostmk-security-api
    restart: unless-stopped
    environment:
      # Application
      - APP_NAME=HostMK Security Framework
      - APP_ENV=${APP_ENV:-development}
      - APP_VERSION=${APP_VERSION:-1.0.0}
      - HOST=0.0.0.0
      - PORT=8080

      # Database
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/security?sslmode=disable

      # Redis
      - REDIS_URL=redis://redis:6379/0

      # JWT
      - JWT_SECRET=${JWT_SECRET:-dev-secret-key-change-in-production}
      - JWT_EXPIRES_IN=15m
      - JWT_REFRESH_EXPIRES_IN=7d

      # Encryption
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-dev-encryption-key-change-in-production}

      # Security
      - ALLOWED_ORIGINS=http://localhost:3000,http://localhost:3001,http://localhost:8080
      - ENABLE_RATE_LIMITING=true
      - RATE_LIMIT_WINDOW_MS=900000
      - RATE_LIMIT_MAX_REQUESTS=100
      - MAX_FAILED_ATTEMPTS=5
      - LOCKOUT_DURATION=900000

      # Logging
      - LOG_LEVEL=info
      - ENABLE_AUDIT_LOGGING=true
      - ENABLE_REQUEST_LOGGING=true

      # Metrics
      - ENABLE_METRICS=true
      - METRICS_PORT=9090
    ports:
      - "8080:8080"
      - "9090:9090"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
      - ./config.yaml:/app/config.yaml:ro
      - ./.env:/app/.env:ro
    networks:
      - hostmk-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    read_only: true
    tmpfs:
      - /tmp:size=100M,mode=1777

  # ============================================================================
  # PostgreSQL Database
  # ============================================================================
  postgres:
    image: postgres:14-alpine
    container_name: hostmk-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=security
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    networks:
      - hostmk-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d security"]
      interval: 10s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - DAC_OVERRIDE

  # ============================================================================
  # Redis Cache
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: hostmk-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis-password}
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - hostmk-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - SETGID
      - SETUID

  # ============================================================================
  # Prometheus Monitoring (Optional)
  # ============================================================================
  prometheus:
    image: prom/prometheus:latest
    container_name: hostmk-prometheus
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - hostmk-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
    profiles:
      - monitoring

  # ============================================================================
  # Grafana Dashboard (Optional)
  # ============================================================================
  grafana:
    image: grafana/grafana:latest
    container_name: hostmk-grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana:/etc/grafana/provisioning
    ports:
      - "3000:3000"
    networks:
      - hostmk-network
    depends_on:
      - prometheus
    profiles:
      - monitoring

  # ============================================================================
  # Nginx Reverse Proxy (Optional)
  # ============================================================================
  nginx:
    image: nginx:alpine
    container_name: hostmk-nginx
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - security-api
    networks:
      - hostmk-network
    profiles:
      - production

  # ============================================================================
  # Migration Runner (Development)
  # ============================================================================
  migrator:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hostmk-migrator
    environment:
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/security?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./migrations:/app/migrations:ro
    networks:
      - hostmk-network
    command: ["migrate", "up"]
    profiles:
      - tools

  # ============================================================================
  # Seed Database (Development)
  # ============================================================================
  seeder:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hostmk-seeder
    environment:
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/security?sslmode=disable
      - JWT_SECRET=${JWT_SECRET:-dev-secret-key-change-in-production}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-dev-encryption-key-change-in-production}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./migrations:/app/migrations:ro
    networks:
      - hostmk-network
    command: ["seed"]
    profiles:
      - tools

# ============================================================================
# Volumes
# ============================================================================
volumes:
  postgres_data:
    driver: local
    name: hostmk-postgres-data

  redis_data:
    driver: local
    name: hostmk-redis-data

  prometheus_data:
    driver: local
    name: hostmk-prometheus-data

  grafana_data:
    driver: local
    name: hostmk-grafana-data

# ============================================================================
# Networks
# ============================================================================
networks:
  hostmk-network:
    driver: bridge
    name: hostmk-network
